<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: sans-serif;
    }

    .menu-holder {
      padding: 2px;
      margin: 0;
      width: 250px;
      background-color: white;
    }

    #menuTitle {
      font-size: 15px;
      font-weight: bold;
      padding: 5px 0;
      font-family: sans-serif;
      padding-top: 10px;
      padding-left: 5px;
    }

    .optionContainer {
        font-family: sans-serif;
        font-size: 14px;
        padding: 6px 0;
    }

    button {
      font-family: sans-serif;
      font-size: 14px;
      width: 100%;
      padding: 6px 0;
      padding-left: 8px;
      border: none;
      background-color: white;
      text-align: left;
      outline: none;
    }

    button:hover {
      background-color: #007fff;
      color: white;
      cursor: pointer;
    }

    #busy {
      background-color: rgba(0, 0, 0, 0.75);
      width: 100%;
      height: 100%;
      display: none;
      position: fixed;
      top: 0;
      margin: 0;
      padding: 0;
    }

    .spinner {
      height: 28px;
      width: 28px;
      animation: rotate 0.8s infinite linear;
      border: 8px solid #fff;
      border-right-color: transparent;
      border-radius: 50%;
      left: 40%;
      top: 40%;
      position: absolute;
    }

    .wait-message {
      font-size: 20px;
      color: white;
      padding: 5px;
    }

    /* A command that ended before it started, said in the popup because the
       content script that shows the extension's other messages is the thing a
       restricted tab does not have. Not an overlay: the menu stays usable, so
       the user can go straight to another action. */
    #failedMessage {
      display: none;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.4;
      color: #7f1d1d;
      background-color: #fdecea;
      border-left: 3px solid #d93025;
      margin: 4px 5px 0 5px;
      padding: 6px 8px;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    #includeStyle,
    #readerMode,
    #reviewBeforeSaving {
      font-family: sans-serif;
      font-size: 14px;
      padding: 0;
      padding-bottom: 8px;
      background-color: white;
      text-align: left;
    }

    select {
      font-family: sans-serif;
      font-size: 14px;
      padding: 2px;
      outline: none;
    }

    input[type="checkbox"] {
        outline: none;
        font-family: sans-serif;
        font-size: 14px;
    }
    #includeStyle,
    #readerMode,
    #reviewBeforeSaving {
        outline: none;
        font-family: sans-serif;
        font-size: 14px;
    }
    .shortcut {
        font-size: 10px;
        color: gray;
    }

    /* The whole difference between opening the library on this page and opening
       it on a capture of this page - one preparatory step, so one checkbox on the
       button that does both rather than a second button beside it. Indented to
       that button's label and small, so it reads as part of the button rather
       than as a fourth of the switches above. */
    #captureFirstOption {
        font-family: sans-serif;
        font-size: 12px;
        display: flex;
        flex-flow: row;
        align-items: center;
        gap: 4px;
        padding: 0 8px 4px 8px;
    }
    #captureFirstOption input {
        flex: 0 0 auto;
        margin: 0;
        cursor: pointer;
    }
    #captureFirst {
        cursor: pointer;
    }

    /* What the style library would do to this page, under the button that opens
       it. Indented to the label text of the buttons above it, so it reads as
       something about them rather than as another menu entry. */
    #currentStyles {
        font-family: sans-serif;
        font-size: 12px;
        padding: 0 8px 6px 8px;
    }
    .currentStyleRow {
        display: flex;
        flex-flow: row;
        align-items: center;
        gap: 4px;
        padding: 1px 0;
    }
    .currentStyleRow input {
        flex: 0 0 auto;
        margin: 0;
        cursor: pointer;
    }
    .currentStyleName {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    #currentStylesNone {
        color: gray;
        width: auto;
        padding: 0;
        font-size: 12px;
        background-color: transparent;
    }
    #currentStylesNone:hover {
        background-color: transparent;
        color: #007fff;
        text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="menu-holder">
    <div id="menuTitle"></div>
    <div id="failedMessage"></div>
    <hr/>
    <div class="optionContainer" id="includeStyleOption">
        <input type="checkbox" name="button" id="includeStyleCheck"></input><span id="includeStyle"></span>
    </div>
    <div class="optionContainer" id="readerModeOption">
        <input type="checkbox" name="button" id="readerModeCheck"></input><span id="readerMode"></span>
    </div>
    <div class="optionContainer" id="reviewBeforeSavingOption">
        <input type="checkbox" name="button" id="reviewBeforeSavingCheck"></input><span id="reviewBeforeSaving"></span>
    </div>
    <button id="styleLibrary" type="button" name="button"></button>
    <div id="captureFirstOption">
        <!-- ticked in the markup, not by script: the popup can be clicked before
             the answer to "is there already a capture of this page?" arrives, and
             capturing when one was not needed only costs time - see menu.js -->
        <input type="checkbox" id="captureFirstCheck" checked></input><label id="captureFirst" for="captureFirstCheck"></label>
    </div>
    <div id="currentStyles"></div>
    <hr/>
    <button id="savePage" type="button" name="button">
        <div id="savePageLabel"></div>
        <div id="savePageShortcut" class="shortcut"></div>
    </button>
    <button id="saveSelection" type="button" name="button">
        <div id="saveSelectionLabel"></div>
        <div id="saveSelectionShortcut" class="shortcut"></div>
    </button>
    <hr/>
    <button id="pageChapter" type="button" name="button">
        <div id="pageChapterLabel"></div>
        <div id="pageChapterShortcut" class="shortcut"></div>
    </button>
    <button id="selectionChapter" type="button" name="button">
        <div id="selectionChapterLabel"></div>
        <div id="selectionChapterShortcut" class="shortcut"></div>
    </button>
    <hr/>
    <button id="editChapters" type="button" name="button"></button>
    <button id="saveDestination" type="button" name="button"></button>
  </div>
  <div id="busy">
    <div class="spinner"></div>
    <div id="waitMessage" class="wait-message"></div>
  </div>

  <!-- The popup says which styles this page would take and lets them be switched
       on and off, so it needs the same matcher the capture path uses - and the
       message wrappers that read and write the library. -->
  <script src="utils.js" charset="utf-8"></script>
  <script src="cssSanitizer.js" charset="utf-8"></script>
  <script src="styleLibrary.js" charset="utf-8"></script>
  <script src="menu.js" charset="utf-8"></script>
</body>

</html>
